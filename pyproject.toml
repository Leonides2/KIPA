[project]
name = "icon-packager-kde"
version = "0.1.0"
description = "Crea, configura y empaqueta temas de iconos personalizados para KDE"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "Pillow>=10.0",
]

[project.scripts]
icon-packager-kde = "src.main:main"

[project.optional-dependencies]
# El binding de Qt no es una dependencia fija: se elige uno de los dos.
# qt6 (PySide6/Plasma 6) es el recomendado; qt5 (PySide2/Plasma 5) es la
# alternativa para sistemas más antiguos (requiere Python <= 3.10, ver
# src/ui/qt_compat.py y src/core/dependency_checker.py).
qt6 = [
    "PySide6>=6.6",
]
qt5 = [
    "PySide2>=5.15.2",
]
dev = [
    "pytest>=8.0",
]
build = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
