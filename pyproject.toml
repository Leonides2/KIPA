[project]
name = "icon-packager-kde"
version = "0.1.0"
description = "Crea, configura y empaqueta temas de iconos personalizados para KDE"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
]

[project.scripts]
icon-packager-kde = "src.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
build = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
